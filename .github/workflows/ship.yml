name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv

      - name: Force buildozer.spec settings
        run: |
          sed -i '/^p4a.bootstrap/d' buildozer.spec || true
          sed -i '/^requirements/d' buildozer.spec || true
          sed -i '/^android.accept_sdk_license/d' buildozer.spec || true
          echo "p4a.bootstrap = webview" >> buildozer.spec
          echo "requirements = python3,flask,requests" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec
          echo "=== buildozer.spec ==="
          cat buildozer.spec

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || \
          yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses || true
          # Pre-create license hash files as a fallback
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license

      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
