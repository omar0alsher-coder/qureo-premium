name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv

      - name: Force buildozer.spec settings
        run: |
          sed -i '/^p4a.bootstrap/d' buildozer.spec || true
          sed -i '/^requirements/d' buildozer.spec || true
          sed -i '/^android.accept_sdk_license/d' buildozer.spec || true
          sed -i '/^android.ndk/d' buildozer.spec || true
          sed -i '/^p4a.port/d' buildozer.spec || true
          sed -i '/^source.include_exts/d' buildozer.spec || true
          sed -i '/^android.permissions/d' buildozer.spec || true
          
          echo "p4a.bootstrap = webview" >> buildozer.spec
          echo "requirements = python3,flask,requests" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          echo "p4a.port = 8080" >> buildozer.spec
          echo "source.include_exts = py,png,jpg,kv,atlas,html,css,js,json" >> buildozer.spec
          echo "android.permissions = INTERNET" >> buildozer.spec

      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
