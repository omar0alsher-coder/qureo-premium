<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qureo Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif;background:#09090b;color:#f8fafc}
.glass{background:rgba(30,41,59,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}
.glow{box-shadow:0 0 20px rgba(59,130,246,.3)}
.cc{transition:all .3s;cursor:pointer}.cc:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 10px 25px -5px rgba(0,0,0,.5);z-index:10}
#log{font-family:monospace;direction:ltr;text-align:left;font-size:13px;line-height:1.6}
#log div{border-bottom:1px solid #1e293b;padding:2px 0}
.lh{color:#c084fc;font-weight:bold;margin-top:8px;border-top:1px solid #334155;padding-top:5px}
.li{color:#60a5fa}.lq{color:#fbbf24}.la{color:#34d399}.ls{color:#10b981;font-weight:bold}
.le{color:#f87171;font-weight:bold}.lw{color:#facc15}
</style></head><body><div id="app" class="min-h-screen"></div>
<script>
function ic(){lucide.createIcons()}
const app=document.getElementById('app');let ck='';
function login(err=''){app.innerHTML=`
<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full blur-[120px] opacity-30"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full blur-[120px] opacity-30"></div>
<div class="glass w-full max-w-md p-8 rounded-2xl relative z-10">
<div class="flex flex-col items-center mb-8"><div class="w-16 h-16 bg-blue-500/20 rounded-2xl flex items-center justify-center mb-4 glow"><i data-lucide="shield" class="w-8 h-8 text-blue-400"></i></div>
<h1 class="text-3xl font-bold text-white mb-2">Qureo Premium</h1><p class="text-slate-400 text-sm">أفضل أداة لحل المراحل 100%</p></div>
${err?`<div class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg mb-4 text-sm text-center">${err}</div>`:''}
<div class="space-y-4">
<div><label class="block text-sm text-slate-300 mb-1">التوكن</label><div class="relative"><i data-lucide="key" class="absolute right-3 top-3 w-5 h-5 text-slate-500"></i>
<textarea id="c" rows="2" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pr-10 pl-4 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="i18next=ar;..."></textarea></div></div>
<div><label class="block text-sm text-slate-300 mb-1">ID الطالب</label><div class="relative"><i data-lucide="user" class="absolute right-3 top-3 w-5 h-5 text-slate-500"></i>
<input id="i" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pr-10 pl-4 text-white focus:outline-none focus:border-blue-500" placeholder="477650905"/></div></div>
<div><label class="block text-sm text-slate-300 mb-1">الباسورد</label><div class="relative"><i data-lucide="lock" class="absolute right-3 top-3 w-5 h-5 text-slate-500"></i>
<input type="password" id="p" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pr-10 pl-4 text-white focus:outline-none focus:border-blue-500" placeholder="****"/></div></div>
<button id="lb" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-2 mt-6"><span>دخول</span><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
</div></div></div>`;ic();
document.getElementById('lb').onclick=async()=>{
const c=document.getElementById('c').value,i=document.getElementById('i').value;
if(!c||!i){login('ادخل التوكن والـ ID');return}
const b=document.getElementById('lb');b.innerHTML='<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> جاري...';ic();
try{const r=await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookies:c})});
const d=await r.json();if(!r.ok)throw new Error(d.error||'فشل');ck=c;dash(d)}catch(e){login(e.message)}}}

function dash(u){app.innerHTML=`
<div class="min-h-screen pb-20">
<header class="glass sticky top-0 z-40 border-b border-slate-800"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center"><i data-lucide="sparkles" class="w-6 h-6 text-blue-400"></i></div>
<div><h1 class="text-lg font-bold">Qureo Dashboard</h1><p class="text-xs text-slate-400">ID: ${u.user_id}</p></div></div>
<div class="flex items-center gap-4"><div class="flex items-center gap-2 bg-slate-800/50 px-4 py-2 rounded-xl border border-slate-700"><span class="text-sm font-bold text-slate-300">جواهر</span><span class="text-xl font-black text-blue-400" id="td">${u.total_diamonds}</span><i data-lucide="diamond" class="w-5 h-5 text-blue-400 fill-current"></i></div>
<button id="lo" class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg"><i data-lucide="log-out" class="w-6 h-6"></i></button></div></div></header>
<main class="max-w-7xl mx-auto px-4 mt-8">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
<div><h2 class="text-2xl font-bold mb-1">المراحل</h2><p class="text-sm text-slate-400">أكمل 1-42 بضمان 100%</p></div>
<div class="flex flex-wrap gap-3 w-full md:w-auto">
<button id="tl" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 font-semibold rounded-xl border border-slate-700 flex items-center justify-center gap-2"><i data-lucide="terminal" class="w-5 h-5"></i>السجل</button>
<button id="mp" class="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-bold rounded-xl flex items-center justify-center gap-2"><i data-lucide="crown" class="w-5 h-5"></i>اجعل الكل PERFECT</button>
<button id="sa" class="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 font-bold rounded-xl flex items-center justify-center gap-2"><i data-lucide="play" class="w-5 h-5 fill-current"></i>حل الكل</button>
</div></div>
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4" id="g"></div></main>
<div id="lc" class="fixed bottom-0 left-0 right-0 h-96 bg-[#0a0a0a] border-t border-slate-700 z-50 flex-col shadow-2xl hidden">
<div class="flex justify-between items-center px-4 py-2 bg-slate-900 border-b border-slate-800">
<div class="flex items-center gap-2 text-sm font-mono"><i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i>Live Logs</div>
<button id="cl" class="text-slate-500 hover:text-white text-2xl">&times;</button></div>
<div id="log" class="flex-1 p-4 overflow-y-auto text-sm"></div></div></div>`;ic();
const g=document.getElementById('g');
u.chapters.forEach(c=>{
let bh='';
if(c.badge==='PERFECT')bh='<span class="text-[10px] font-black text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded-md border border-emerald-400/20">PERFECT</span>';
else if(c.badge==='CLEAR')bh='<span class="text-[10px] font-black text-blue-400 bg-blue-400/10 px-2 py-1 rounded-md border border-blue-400/20">CLEAR</span>';
else bh='<span class="text-[10px] font-black text-rose-400 bg-rose-400/10 px-2 py-1 rounded-md border border-rose-400/20">RETRY</span>';
let dv=document.createElement('div');
dv.className=`cc glass rounded-2xl p-4 flex flex-col border-t-4 ${c.badge==='PERFECT'?'border-t-emerald-500':(c.badge==='CLEAR'?'border-t-blue-500':'border-t-slate-600')}`;
dv.innerHTML=`<div class="flex justify-between items-start mb-2"><span class="text-xs font-bold text-slate-400 bg-slate-900/50 px-2 py-1 rounded-md">مرحلة ${c.num}</span>${bh}</div>
<div class="flex items-center justify-center py-4">${c.badge==='PERFECT'?'<div class="w-12 h-12 rounded-full bg-emerald-500/20 flex items-center justify-center"><i data-lucide="crown" class="w-6 h-6 text-emerald-400"></i></div>':'<div class="w-12 h-12 rounded-full bg-slate-700/50 flex items-center justify-center"><i data-lucide="play" class="w-5 h-5 text-slate-400 fill-current"></i></div>'}</div>
<div class="flex justify-between items-center mt-auto pt-2 border-t border-slate-700/50">
<div class="flex items-center gap-1 text-xs text-slate-400"><i data-lucide="book-open" class="w-3 h-3"></i>${c.score}/${c.total_q}</div>
<div class="flex items-center gap-1 text-xs font-bold text-blue-400">${c.diamond}<i data-lucide="diamond" class="w-3 h-3 fill-current"></i></div>
</div>`;
dv.onclick=()=>one(c.id);g.appendChild(dv)});ic();
document.getElementById('lo').onclick=()=>{ck='';login()};
const lc=document.getElementById('lc');
document.getElementById('tl').onclick=()=>{lc.classList.toggle('hidden');lc.classList.toggle('flex')};
document.getElementById('cl').onclick=()=>{lc.classList.add('hidden');lc.classList.remove('flex')};
document.getElementById('mp').onclick=()=>{if(!confirm('حل المراحل غير PERFECT فقط؟'))return;lc.classList.remove('hidden');lc.classList.add('flex');stream('/api/solve_all?mode=perfect&cookies='+encodeURIComponent(ck))};
document.getElementById('sa').onclick=()=>{if(!confirm('حل جميع المراحل 1-42؟'))return;lc.classList.remove('hidden');lc.classList.add('flex');stream('/api/solve_all?mode=all&cookies='+encodeURIComponent(ck))}}

async function stream(url){const t=document.getElementById('log');t.innerHTML='<p class="text-blue-400">جاري الاتصال...</p>';
try{const r=await fetch(url);const rd=r.body.getReader();const dc=new TextDecoder();t.innerHTML='';
while(true){const{done,value}=await rd.read();if(done)break;const ch=dc.decode(value,{stream:true});for(const l of ch.split('\n\n')){
if(l.startsWith('data: ')){const s=l.replace('data: ','');if(!s.trim())continue;const d=JSON.parse(s);if(d.msg==='DONE'){refresh();return}
const p=document.createElement('div');p.className='l'+(d.type==='header'?'h':d.type==='success'?'s':d.type==='error'?'e':d.type==='warn'?'w':d.type==='q'?'q':d.type==='a'?'a':'i');
p.innerText=d.msg;t.appendChild(p);if(t.scrollHeight-t.scrollTop-t.clientHeight<100)t.scrollTop=t.scrollHeight}}}}
catch(e){t.innerHTML+='<p class="le mt-2">انقطع: '+e.message+'</p>'}}

function one(cid){const lc=document.getElementById('lc');lc.classList.remove('hidden');lc.classList.add('flex');stream('/api/solve_one?cookies='+encodeURIComponent(ck)+'&chapter_id='+cid)}

async function refresh(){const r=await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookies:ck})});
const d=await r.json();if(r.ok){document.getElementById('td').innerText=d.total_diamonds;dash(d)}}

login();
</script></body></html>
