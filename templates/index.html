<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qureo Premium Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #09090b; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .chapter-card { transition: all 0.3s ease; cursor: pointer; }
        .chapter-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); z-index: 10; }
        #logTerminal { font-family: monospace; direction: ltr; text-align: left; font-size: 13px; line-height: 1.6; }
        #logTerminal div { border-bottom: 1px solid #1e293b; padding: 2px 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .log-header { color: #c084fc; font-weight: bold; margin-top: 8px; border-top: 1px solid #334155; padding-top: 5px; }
        .log-info { color: #60a5fa; }
        .log-q { color: #fbbf24; }
        .log-a { color: #34d399; }
        .log-success { color: #10b981; font-weight: bold; }
        .log-error { color: #f87171; font-weight: bold; }
        .log-warn { color: #facc15; }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen"></div>

    <script>
        function initIcons() { lucide.createIcons(); }

        const app = document.getElementById('app');
        let currentCookies = '';
        let chaptersData = [];

        function renderLogin(errorMsg = '') {
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full blur-[120px] opacity-30"></div>
                    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full blur-[120px] opacity-30"></div>
                    
                    <div class="glass w-full max-w-md p-8 rounded-2xl relative z-10">
                        <div class="flex flex-col items-center mb-8">
                            <div class="w-16 h-16 bg-blue-500/20 rounded-2xl flex items-center justify-center mb-4 glow">
                                <i data-lucide="shield" class="w-8 h-8 text-blue-400"></i>
                            </div>
                            <h1 class="text-3xl font-bold text-white mb-2">Qureo Premium</h1>
                            <p class="text-slate-400 text-sm">أفضل أداة لحل المراحل بضمان 100%</p>
                        </div>

                        ${errorMsg ? `<div class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg mb-4 text-sm text-center">${errorMsg}</div>` : ''}

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">التوكن (Cookie)</label>
                                <div class="relative">
                                    <i data-lucide="key" class="absolute right-3 top-3 w-5 h-5 text-slate-500"></i>
                                    <textarea id="cookieInput" rows="2" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pr-10 pl-4 text-white focus:outline-none focus:border-blue-500 transition-colors text-sm" placeholder="i18next=ar; egy_student_access_token=..."></textarea>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">رقم الطالب (ID)</label>
                                <div class="relative">
                                    <i data-lucide="user" class="absolute right-3 top-3 w-5 h-5 text-slate-500"></i>
                                    <input type="text" id="studentId" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pr-10 pl-4 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="477650905" />
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">كلمة المرور</label>
                                <div class="relative">
                                    <i data-lucide="key" class="absolute right-3 top-3 w-5 h-5 text-slate-500"></i>
                                    <input type="password" id="password" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pr-10 pl-4 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="********" />
                                </div>
                            </div>
                            <button id="loginBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition-all flex justify-center items-center gap-2 mt-6">
                                <span>دخول للمنصة</span>
                                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            initIcons();

            document.getElementById('loginBtn').addEventListener('click', async () => {
                const cookies = document.getElementById('cookieInput').value;
                const id = document.getElementById('studentId').value;

                if(!cookies || !id) { renderLogin("الرجاء إدخال التوكن ورقم الطالب"); return; }

                const btn = document.getElementById('loginBtn');
                btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>جاري الدخول...</span>`;
                initIcons();

                try {
                    const res = await fetch('/api/status', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({cookies})
                    });
                    const data = await res.json();
                    if(!res.ok) throw new Error(data.error || "فشل الاتصال");
                    
                    currentCookies = cookies;
                    chaptersData = data.chapters;
                    renderDashboard(data);
                } catch(e) {
                    renderLogin(e.message);
                }
            });
        }

        function renderDashboard(userData) {
            app.innerHTML = `
                <div class="min-h-screen pb-20">
                    <header class="glass sticky top-0 z-40 border-b border-slate-800">
                        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center">
                                    <i data-lucide="sparkles" class="w-6 h-6 text-blue-400"></i>
                                </div>
                                <div>
                                    <h1 class="text-lg font-bold text-white">Qureo Dashboard</h1>
                                    <p class="text-xs text-slate-400">ID: ${userData.user_id}</p>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-4">
                                <div class="flex items-center gap-2 bg-slate-800/50 px-4 py-2 rounded-xl border border-slate-700">
                                    <span class="text-sm font-bold text-slate-300">الجواهر</span>
                                    <span class="text-xl font-black text-blue-400" id="totalDiamonds">${userData.total_diamonds}</span>
                                    <i data-lucide="diamond" class="w-5 h-5 text-blue-400 fill-current"></i>
                                </div>
                                <button id="logoutBtn" class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-colors" title="تسجيل خروج">
                                    <i data-lucide="log-out" class="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto px-4 mt-8">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                            <div>
                                <h2 class="text-2xl font-bold text-white mb-1">المراحل</h2>
                                <p class="text-sm text-slate-400">أكمل جميع المراحل (1 - 42) بضمان 100%</p>
                            </div>
                            <div class="flex flex-wrap gap-3 w-full md:w-auto">
                                <button id="toggleLogsBtn" class="flex-1 md:flex-none px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl border border-slate-700 flex items-center justify-center gap-2">
                                    <i data-lucide="terminal" class="w-5 h-5"></i> <span>السجل</span>
                                </button>
                                <button id="makePerfectBtn" class="flex-1 md:flex-none px-6 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl shadow-lg shadow-purple-900/20 flex items-center justify-center gap-2">
                                    <i data-lucide="crown" class="w-5 h-5"></i> <span>اجعل الكل PERFECT</span>
                                </button>
                                <button id="solveAllBtn" class="flex-1 md:flex-none px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2">
                                    <i data-lucide="play" class="w-5 h-5 fill-current"></i> <span>حل الكل (1-42)</span>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4" id="chaptersGrid"></div>
                    </main>

                    <div id="logsContainer" class="fixed bottom-0 left-0 right-0 h-96 bg-[#0a0a0a] border-t border-slate-700 z-50 flex-col shadow-2xl hidden">
                        <div class="flex justify-between items-center px-4 py-2 bg-slate-900 border-b border-slate-800">
                            <div class="flex items-center gap-2 text-sm text-slate-300 font-mono">
                                <i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i>
                                <span>Live Logs</span>
                            </div>
                            <button id="closeLogsBtn" class="text-slate-500 hover:text-white text-2xl">&times;</button>
                        </div>
                        <div id="logTerminal" class="flex-1 p-4 overflow-y-auto text-sm"></div>
                    </div>
                </div>
            `;
            initIcons();

            const grid = document.getElementById('chaptersGrid');
            chaptersData.forEach(c => {
                let badgeHtml = '';
                if (c.badge === 'PERFECT') badgeHtml = `<span class="text-[10px] font-black text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded-md border border-emerald-400/20">PERFECT</span>`;
                else if (c.badge === 'CLEAR') badgeHtml = `<span class="text-[10px] font-black text-blue-400 bg-blue-400/10 px-2 py-1 rounded-md border border-blue-400/20">CLEAR</span>`;
                else badgeHtml = `<span class="text-[10px] font-black text-rose-400 bg-rose-400/10 px-2 py-1 rounded-md border border-rose-400/20">RETRY</span>`;

                let div = document.createElement('div');
                div.className = `chapter-card glass rounded-2xl p-4 flex flex-col relative overflow-hidden group border-t-4 ${c.badge === 'PERFECT' ? 'border-t-emerald-500' : (c.badge === 'CLEAR' ? 'border-t-blue-500' : 'border-t-slate-600')}`;
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold text-slate-400 bg-slate-900/50 px-2 py-1 rounded-md">مرحلة ${c.num}</span>
                        ${badgeHtml}
                    </div>
                    <div class="flex items-center justify-center py-4">
                        ${c.badge === 'PERFECT' ? `
                            <div class="w-12 h-12 rounded-full bg-emerald-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i data-lucide="crown" class="w-6 h-6 text-emerald-400"></i>
                            </div>
                        ` : `
                            <div class="w-12 h-12 rounded-full bg-slate-700/50 flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i data-lucide="play" class="w-5 h-5 text-slate-400 fill-current"></i>
                            </div>
                        `}
                    </div>
                    <div class="flex justify-between items-center mt-auto pt-2 border-t border-slate-700/50">
                        <div class="flex items-center gap-1 text-xs text-slate-400">
                            <i data-lucide="book-open" class="w-3 h-3"></i> <span>${c.score}/${c.total_q}</span>
                        </div>
                        <div class="flex items-center gap-1 text-xs font-bold text-blue-400">
                            <span>${c.diamond}</span> <i data-lucide="diamond" class="w-3 h-3 fill-current"></i>
                        </div>
                    </div>
                `;
                div.addEventListener('click', () => solveOne(c.id));
                grid.appendChild(div);
            });
            initIcons();

            document.getElementById('logoutBtn').addEventListener('click', () => {
                currentCookies = ''; chaptersData = [];
                renderLogin();
            });

            const logsContainer = document.getElementById('logsContainer');
            document.getElementById('toggleLogsBtn').addEventListener('click', () => {
                logsContainer.classList.toggle('hidden');
                logsContainer.classList.toggle('flex');
            });
            document.getElementById('closeLogsBtn').addEventListener('click', () => {
                logsContainer.classList.add('hidden');
                logsContainer.classList.remove('flex');
            });

            document.getElementById('makePerfectBtn').addEventListener('click', () => {
                if(!window.confirm("هيتم إعادة حل كل المراحل اللي مش PERFECT. متأكد؟")) return;
                logsContainer.classList.remove('hidden');
                logsContainer.classList.add('flex');
                streamResponse(`/api/solve_all?mode=perfect&cookies=${encodeURIComponent(currentCookies)}`);
            });

            document.getElementById('solveAllBtn').addEventListener('click', () => {
                if(!window.confirm("هل أنت متأكد من حل جميع المراحل 1-42؟")) return;
                logsContainer.classList.remove('hidden');
                logsContainer.classList.add('flex');
                streamResponse(`/api/solve_all?mode=all&cookies=${encodeURIComponent(currentCookies)}`);
            });
        }

        async function streamResponse(url) {
            const terminal = document.getElementById('logTerminal');
            terminal.innerHTML = '<p class="text-blue-400">جاري الاتصال بالبث المباشر...</p>';
            
            try {
                const response = await fetch(url);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                terminal.innerHTML = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n\n');
                    
                    for (let line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '');
                            if (!dataStr.trim()) continue;
                            
                            const data = JSON.parse(dataStr);
                            if (data.msg === 'DONE') {
                                refreshData();
                                return;
                            }
                            
                            let p = document.createElement('div');
                            p.className = `log-${data.type || 'info'}`;
                            p.innerText = data.msg;
                            terminal.appendChild(p);
                            
                            if (terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 100) {
                                terminal.scrollTop = terminal.scrollHeight;
                            }
                        }
                    }
                }
            } catch (err) {
                terminal.innerHTML += `<p class="log-error mt-2">انقطع الاتصال: ${err.message}</p>`;
            }
        }

        function solveOne(chapId) {
            const logsContainer = document.getElementById('logsContainer');
            logsContainer.classList.remove('hidden');
            logsContainer.classList.add('flex');
            streamResponse(`/api/solve_one?cookies=${encodeURIComponent(currentCookies)}&chapter_id=${chapId}`);
        }

        async function refreshData() {
            const res = await fetch('/api/status', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cookies: currentCookies})
            });
            const data = await res.json();
            if(res.ok) {
                chaptersData = data.chapters;
                document.getElementById('totalDiamonds').innerText = data.total_diamonds;
                renderDashboard(data);
            }
        }

        renderLogin();
    </script>
</body>
</html>
