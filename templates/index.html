<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qureo Solver</title>
    <style>
        body { background-color: #0f111a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #333; background: #1e1e2f; color: #fff; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 80px; resize: none; }
        button { background: #00bcd4; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #00acc1; }
        .btn-solve-all { background: #4caf50; color: white; margin-bottom: 15px; font-size: 16px; }
        .chapter { display: flex; justify-content: space-between; align-items: center; background: #1e1e2f; padding: 10px; margin: 5px 0; border-radius: 8px; font-size: 14px; }
        .chapter-info { flex: 1; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin: 0 5px; }
        .PERFECT { background: #4caf50; color: white; }
        .CLEAR { background: #ff9800; color: white; }
        .RETRY { background: #f44336; color: white; }
        .solve-btn { background: #2196f3; color: white; padding: 6px 12px; width: auto; margin: 0; font-size: 12px; }
        #log { background: #000; color: #00ff00; font-family: monospace; padding: 10px; height: 250px; overflow-y: auto; border-radius: 8px; margin-top: 15px; font-size: 12px; display: none; white-space: pre-wrap; }
        .hidden { display: none; }
        h2 { text-align: center; color: #00bcd4; }
        .user-info { text-align: center; margin-bottom: 10px; color: #aaa; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Qureo Solver</h2>
    
    <div id="login-section">
        <textarea id="cookies" placeholder="أدخل الكوكيز هنا (Cookies)"></textarea>
        <button onclick="login()">تسجيل الدخول 🚀</button>
    </div>

    <div id="main-section" class="hidden">
        <div class="user-info" id="user-info"></div>
        <button class="btn-solve-all" onclick="solveAll('all')">حل كل المراحل (الطلقة) 💥</button>
        <div id="chapters-list"></div>
    </div>

    <div id="log"></div>
</div>

<script>
    let currentCookies = '';
    
    // طلب إذن الإشعارات
    if ("Notification" in window) {
        Notification.requestPermission();
    }

    async function login() {
        currentCookies = document.getElementById('cookies').value;
        if(!currentCookies) return alert("أدخل الكوكيز أولاً");

        document.getElementById('login-section').innerHTML = "جاري الاتصال...";
        showLog();
        logMsg("🔄 جاري تسجيل الدخول...", "#00bcd4");

        try {
            const res = await fetch('/api/status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cookies: currentCookies})
            });
            const data = await res.json();
            if(data.error) return logMsg("❌ " + data.error, "red");

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            document.getElementById('user-info').innerText = `${data.name || data.user_id} | 💎 ${data.total_diamonds}`;
            
            renderChapters(data.chapters);
            logMsg("✅ تم تسجيل الدخول بنجاح", "lime");
        } catch(e) {
            logMsg("❌ فشل الاتصال بالسيرفر", "red");
        }
    }

    function renderChapters(chapters) {
        const container = document.getElementById('chapters-list');
        container.innerHTML = '';
        chapters.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'chapter';
            div.innerHTML = `
                <div class="chapter-info">
                    ${ch.num}. مرحلة 
                    <span class="badge ${ch.badge}">[${ch.badge}] (${ch.score}/${ch.total_q})</span>
                </div>
                <button class="solve-btn" onclick="solveOne(${ch.id}, ${ch.num})">حل</button>
            `;
            container.appendChild(div);
        });
    }

    function showLog() {
        document.getElementById('log').style.display = 'block';
        document.getElementById('log').innerHTML = '';
    }

    function logMsg(msg, color = "#00ff00") {
        const log = document.getElementById('log');
        log.innerHTML += `<div style="color:${color}">${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    function solveOne(id, num) {
        showLog();
        logMsg(`🚀 بدء حل المرحلة ${num}...`, "#00bcd4");
        const url = `/api/solve_one?cookies=${encodeURIComponent(currentCookies)}&chapter_id=${id}`;
        startSSE(url, num);
    }

    function solveAll(mode) {
        showLog();
        logMsg(`💥 بدء الحل الشامل...`, "#00bcd4");
        const url = `/api/solve_all?cookies=${encodeURIComponent(currentCookies)}&mode=${mode}`;
        startSSE(url, null);
    }

    function startSSE(url, chapNum) {
        const evtSource = new EventSource(url);
        evtSource.onmessage = function(e) {
            const data = JSON.parse(e.data);
            let color = "#00ff00";
            if(data.type === "error") color = "red";
            if(data.type === "header") color = "#00bcd4";
            if(data.type === "success") color = "lime";
            if(data.type === "warn") color = "orange";
            
            logMsg(data.msg, color);
            
            // إشعار عند نجاح المرحلة
            if (data.msg.includes("🎉 انتهى")) {
                if (Notification.permission === "granted") {
                    new Notification("Qureo Solver", { body: chapNum ? `تم حل المرحلة ${chapNum} بنجاح!` : "تم حل جميع المراحل!" });
                }
            }

            if(data.type === 'done') {
                evtSource.close();
                logMsg("✅ انتهى!", "lime");
                fetch('/api/status', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cookies: currentCookies})})
                .then(r=>r.json()).then(d=>{ if(d.chapters) renderChapters(d.chapters); });
            }
        };
        evtSource.onerror = function() { evtSource.close(); };
    }
</script>
</body>
</html>
