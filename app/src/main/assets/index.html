<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Qureo Solver</title>
    <style>
        body { background-color: #0f111a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: env(safe-area-inset-top) 15px 15px 15px; user-select: none; }
        .container { max-width: 600px; margin: auto; padding-top: 20px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #333; background: #1e1e2f; color: #fff; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { background: #00bcd4; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-solve-all { background: #4caf50; color: white; margin-bottom: 15px; font-size: 16px; }
        .chapter { display: flex; justify-content: space-between; align-items: center; background: #1e1e2f; padding: 10px; margin: 5px 0; border-radius: 8px; font-size: 14px; }
        .chapter-info { flex: 1; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin: 0 5px; }
        .PERFECT { background: #4caf50; color: white; }
        .CLEAR { background: #ff9800; color: white; }
        .RETRY { background: #f44336; color: white; }
        .solve-btn { background: #2196f3; color: white; padding: 6px 12px; width: auto; margin: 0; font-size: 12px; }
        #log { background: #000; color: #00ff00; font-family: monospace; padding: 10px; height: 250px; overflow-y: auto; border-radius: 8px; margin-top: 15px; font-size: 12px; display: none; white-space: pre-wrap; border: 1px solid #333; }
        .hidden { display: none; }
        h2 { text-align: center; color: #00bcd4; margin-top: 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>Qureo Solver</h2>
    <div id="login-section">
        <input type="text" id="student_id" placeholder="Student ID (الأيدي)">
        <input type="password" id="password" placeholder="Password (الباسورد)">
        <button onclick="login()">تسجيل الدخول 🚀</button>
    </div>

    <div id="main-section" class="hidden">
        <button class="btn-solve-all" onclick="solveAll('all')">حل كل المراحل (الطلقة) 💥</button>
        <div id="chapters-list"></div>
    </div>
    <div id="log"></div>
</div>

<script>
    const BASE = "https://me-tp.qureo.education";
    const PORTAL = "https://me-portal.qureo.education";
    let callbacks = {};
    let cbId = 0;
    let currentCookies = "";
    let currentSectionId = null;

    function apiRequest(method, url, body = null) {
        return new Promise((resolve, reject) => {
            const id = cbId++;
            callbacks[id] = { resolve, reject };
            const bodyStr = body ? JSON.stringify(body) : "";
            AndroidNative.httpRequest(method, url, bodyStr, id.toString());
        });
    }

    window.onBridgeResponse = function(reqId, bodyStr, statusCode, cookies) {
        if(cookies) currentCookies = cookies;
        const cb = callbacks[reqId];
        if (!cb) return;
        
        let parsedBody = bodyStr;
        try { parsedBody = JSON.parse(bodyStr); } catch(e) {}
        
        cb.resolve({ status: statusCode, body: parsedBody, cookies: cookies });
        delete callbacks[reqId];
    };

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const logMsg = (msg, color = "#00ff00") => {
        const log = document.getElementById('log');
        log.style.display = 'block';
        log.innerHTML += `<div style="color:${color}">${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    };

    async function login() {
        const sid = document.getElementById('student_id').value.trim();
        const pwd = document.getElementById('password').value.trim();
        if (!sid || !pwd) return alert("أدخل الأيدي والباسورد");
        
        logMsg("جاري تسجيل الدخول...", "#00bcd4");
        
        try {
            // 1. تسجيل الدخول
            const res = await apiRequest("POST", `${PORTAL}/oauth2/password-login`, {student_id: sid, password: pwd});
            
            // لو رجع 302 يعني نجح
            if (res.status === 302 || res.status === 200) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                logMsg("✅ تم تسجيل الدخول", "lime");
                await loadStatus();
            } else {
                logMsg("❌ فشل تسجيل الدخول، تأكد من البيانات", "red");
            }
        } catch(e) {
            logMsg("❌ خطأ: " + e.message, "red");
        }
    }

    async function loadStatus() {
        try {
            // استخراج المادة من الكوكيز اللي رجعت من السيرفر
            let courseId = "javascript_ar";
            const match = currentCookies.match(/student_selected_content_id=([^;]+)/);
            if (match) courseId = match[1];

            // جلب السكشن
            const courseData = await apiRequest("GET", `${BASE}/api/study/courses/${courseId}`);
            currentSectionId = courseData.body.basic_section.id;

            // جلب المراحل
            const meta = await apiRequest("GET", `${BASE}/api/study/sections/${currentSectionId}`);
            const chaptersList = meta.body.chapters;

            // جلب التقدم
            const progress = await apiRequest("GET", `${BASE}/api/study/students/sections/${currentSectionId}/chapters`);
            const progress_map = {};
            if(Array.isArray(progress.body)) progress.body.forEach(x => progress_map[x.chapter_id] = x);

            const container = document.getElementById('chapters-list');
            container.innerHTML = '';
            
            chaptersList.forEach((ch, index) => {
                const id = ch.id;
                const num = ch.seq || (index + 1);
                const info = progress_map[id] || {};
                const sc = info.best_correct_count || 0;
                const qn = ch.question_count || 5;
                
                let badge = "RETRY";
                if (sc === qn && qn > 0) badge = "PERFECT";
                else if (sc > 0) badge = "CLEAR";

                container.innerHTML += `
                    <div class="chapter">
                        <div class="chapter-info">${num}. ${ch.name || 'مرحلة'} <span class="badge ${badge}">[${badge}] (${sc}/${qn})</span></div>
                        <button class="solve-btn" onclick="solveOne(${id}, ${num})">حل</button>
                    </div>`;
            });
        } catch(e) { logMsg("خطأ في جلب الحالة: " + e.message, "red"); }
    }

    async function solveOne(chapId, num) {
        document.getElementById('log').innerHTML = "";
        logMsg(`🚀 بدء المرحلة ${num}...`, "#00bcd4");
        try {
            await processChapter(chapId);
            AndroidNative.notify("Qureo Solver", `تم حل المرحلة ${num} بنجاح!`);
            await loadStatus();
        } catch(e) { logMsg("❌ خطأ: " + e.message, "red"); }
    }

    async function solveAll(mode) {
        document.getElementById('log').innerHTML = "";
        logMsg(`💥 بدء الحل الشامل...`, "#00bcd4");
        try {
            let courseId = "javascript_ar";
            const match = currentCookies.match(/student_selected_content_id=([^;]+)/);
            if (match) courseId = match[1];

            const courseData = await apiRequest("GET", `${BASE}/api/study/courses/${courseId}`);
            const sectionId = courseData.body.basic_section.id;

            const meta = await apiRequest("GET", `${BASE}/api/study/sections/${sectionId}`);
            const chaptersList = meta.body.chapters;
            
            const progress = await apiRequest("GET", `${BASE}/api/study/students/sections/${sectionId}/chapters`);
            const progress_map = {};
            if(Array.isArray(progress.body)) progress.body.forEach(x => progress_map[x.chapter_id] = x);

            for (let ch of chaptersList) {
                const id = ch.id;
                const num = ch.seq || 0;
                const info = progress_map[id] || {};
                const sc = info.best_correct_count || 0;
                const qn = ch.question_count || 5;

                if (mode === 'perfect' && sc >= qn) continue;
                
                logMsg(`\n=== المرحلة ${num} ===`, "#00bcd4");
                await processChapter(id);
                AndroidNative.notify("Qureo Solver", `تم حل المرحلة ${num} بنجاح!`);
                await sleep(200);
            }
            await loadStatus();
            logMsg("🎉🎉🎉 انتهى الكل!", "lime");
            AndroidNative.notify("Qureo Solver", "تم حل جميع المراحل بنجاح!");
        } catch(e) { logMsg("❌ خطأ: " + e.message, "red"); }
    }

    async function processChapter(chapId) {
        const data = await apiRequest("GET", `${BASE}/api/study/chapters/${chapId}`);
        const testType = data.body.chapter.test_type || "test";
        const prefix = testType === "test" ? "test" : "review";
        const ep = `/api/study/students/${prefix}-questions`;

        // الدروس
        if (data.body.lectures && data.body.lectures.length > 0) {
            for (let lec of data.body.lectures) {
                logMsg(`▶ درس ${lec.id}`, "info");
                await apiRequest("PUT", `${BASE}/api/study/students/lectures/${lec.id}`, {});
                const lr = await apiRequest("GET", `${BASE}/api/study/lectures/${lec.id}`);
                if (lr.body.talks) {
                    for (let t of lr.body.talks) {
                        if (t.type === "try") {
                            const ans = t.body.codes[0].model_answer;
                            if (ans) {
                                await apiRequest("PUT", `${BASE}/api/study/students/lecture-talks/${t.id}`, {value: {try: {lang: "javascript", answer: ans}}});
                                await sleep(50);
                            }
                        }
                    }
                }
                await apiRequest("PUT", `${BASE}/api/study/students/lectures/${lec.id}/complete`, {});
            }
            await sleep(500);
        }

        // الأسئلة
        const qList = await apiRequest("GET", `${BASE}/api/study/chapters/${chapId}/test`);
        const questions = qList.body.map(q => ({ id: q.question.id, type: q.question.type })).filter(q => q.id);
        
        if (questions.length === 0) return;

        logMsg(`🔵 PASS 1 (${questions.length} أسئلة)...`, "info");
        await apiRequest("DELETE", `${BASE}/api/study/students/chapters/${chapId}/test`);
        await apiRequest("PUT", `${BASE}/api/study/students/chapters/${chapId}/test`, {});
        
        for (let q of questions) {
            if (q.type === "choice") await apiRequest("PUT", `${BASE}${ep}/${q.id}/answer/choice`, {choice_id: parseInt(q.id + "1")});
            else await apiRequest("PUT", `${BASE}${ep}/${q.id}/answer/description`, {answer_code: "let _x=0;"});
            await sleep(50);
        }

        await sleep(800);
        const r1 = await apiRequest("GET", `${BASE}/api/study/students/chapters/${chapId}/${prefix}/result`);
        let answers = {};
        const res = r1.body.result || r1.body;
        if (res.choice_results) {
            for (let cr of res.choice_results) {
                let correct = (cr.choices || []).find(c => c.correct);
                if (correct && correct.choice) answers[cr.question_id] = { choice_id: correct.choice.id, text: correct.choice.content };
            }
        }
        if (res.description_results) {
            for (let dr of res.description_results) {
                if (dr.model_answer) answers[dr.question_id] = { answer_code: dr.model_answer };
            }
        }

        logMsg(`🟢 PASS 2...`, "info");
        await apiRequest("DELETE", `${BASE}/api/study/students/chapters/${chapId}/test`);
        await apiRequest("PUT", `${BASE}/api/study/students/chapters/${chapId}/test`, {});

        for (let q of questions) {
            if (q.id in answers) {
                if (q.type === "choice") await apiRequest("PUT", `${BASE}${ep}/${q.id}/answer/choice`, {choice_id: answers[q.id].choice_id});
                else await apiRequest("PUT", `${BASE}${ep}/${q.id}/answer/description`, {answer_code: answers[q.id].answer_code});
                await sleep(50);
            }
        }

        await sleep(800);
        const rf = await apiRequest("GET", `${BASE}/api/study/students/chapters/${chapId}/${prefix}/result`);
        const score = (rf.body.result || rf.body).correct_count || 0;
        logMsg(`🎉 النتيجة: ${score}/${questions.length}`, "lime");
    }
</script>
</body>
</html>
